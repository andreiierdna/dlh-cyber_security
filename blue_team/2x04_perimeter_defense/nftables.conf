table inet meddefense {
	set dmz {
		type ipv4_addr
		flags interval
		elements = { 172.16.10.0/24,10.10.5.0/24 }
	}

	set internal {
		type ipv4_addr
		flags interval
		elements = { 10.10.0.0/16,172.16.20.0/24 }
	}

	set mgmt {
		type ipv4_addr
		flags interval
		elements = { 172.16.30.0/24 }
	}

	set meddev {
		type ipv4_addr
		flags interval
		elements = { 10.10.4.0/24,172.16.40.0/24 }
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		iifname "lo" accept
		ip protocol icmp accept
		ip6 nexthdr ipv6-icmp accept

		# --- flows that terminate on this host (INTERNAL server_host) ---
		ip saddr @mgmt tcp dport 22 accept comment "segmentation mgmt->local port 22"
		ip saddr @internal tcp dport 443 accept comment "segmentation internal->local port 443"
		ip saddr @internal tcp dport 3306 accept comment "segmentation internal->local port 3306"
		ip saddr @dmz tcp dport 3306 accept comment "segmentation dmz->local port 3306"
		ip saddr @meddev tcp dport 4242 accept comment "segmentation meddev->local port 4242"
		ip saddr @meddev tcp dport 443 accept comment "segmentation meddev->local port 443"
		udp dport 53 accept comment "ALL->MGMT dns"
		tcp dport 53 accept comment "ALL->MGMT dns"
		ip saddr 10.0.2.0/24 tcp dport 22 accept comment "lab-access (VirtualBox NAT admin path)"

		# denied packets are visible to the SOC (ufw.log / syslog)
		log prefix "meddefense-drop: " limit rate 10/second
		counter
	}

	chain forward {
		type filter hook forward priority filter; policy drop;

		ct state established,related accept
		ip saddr @mgmt ip daddr @internal tcp dport 22 accept
		ip saddr @mgmt ip daddr @dmz tcp dport 22 accept
		ip saddr @internal ip daddr @internal tcp dport 443 accept
		ip saddr @internal ip daddr @internal tcp dport 3306 accept
		ip saddr @dmz ip daddr @internal tcp dport 3306 accept
		ip saddr @meddev ip daddr @internal tcp dport 4242 accept
		ip saddr @meddev ip daddr @internal tcp dport 443 accept
		ip saddr @mgmt ip daddr @meddev tcp dport 22 accept
		ip saddr @mgmt ip daddr @meddev tcp dport 4242 accept

		log prefix "meddefense-fwd-drop: " limit rate 10/second
		counter
	}

	chain output {
		type filter hook output priority filter; policy accept;

		# this host is INTERNAL: it must not initiate sessions into MEDDEV
		# (only MGMT may reach medical devices, T2 deny_all)
		ip daddr @meddev drop comment "INTERNAL->MEDDEV denied by design"
	}
}
